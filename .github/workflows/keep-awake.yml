name: Keep the database awake

# Supabase pauses a free project after about a week without activity.
# This calls the public health function twice a week, which reads the database once.
# Note: GitHub turns scheduled workflows off after 60 days without a commit;
# it sends an email first, and "Run workflow" below turns it back on.

on:
  schedule:
    - cron: "17 6 * * 1,4" # Monday and Thursday, 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call the health function
        run: |
          body=$(curl --silent --show-error --fail --max-time 30 --retry 3 --retry-delay 10             "https://ivumqjbmrubwmjsrfazj.supabase.co/functions/v1/health")
          echo "$body"
          echo "$body" | grep -q '"ok":true'
